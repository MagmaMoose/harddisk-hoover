{{- if .Values.networkPolicy.enabled }}
# Nothing calls into these pods, and the cleanup pods call nothing over the network:
# they work through the node's filesystem and the runtime's unix socket.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "harddisk-hoover.fullname" . }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harddisk-hoover.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "harddisk-hoover.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
# The controller reaches the Kubernetes API and nothing else. It uses the in-cluster
# address from the environment, so it needs no DNS either.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "harddisk-hoover.fullname" . }}-controller-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harddisk-hoover.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "harddisk-hoover.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  policyTypes:
    - Egress
  egress:
    {{- range .Values.networkPolicy.apiServer }}
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
      ports:
        {{- range .ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
