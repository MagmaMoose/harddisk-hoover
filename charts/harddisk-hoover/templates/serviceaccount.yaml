# The controller's account: creates and watches the cleanup pods. Its token is mounted
# by the CronJob's pod spec, not here, so nothing else that uses it gets one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "harddisk-hoover.controllerServiceAccount" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harddisk-hoover.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
# The cleanup pods' account. It has no permissions and no token: the cleanup talks to
# the node, never to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "harddisk-hoover.cleanupServiceAccount" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harddisk-hoover.labels" . | nindent 4 }}
    app.kubernetes.io/component: cleanup
automountServiceAccountToken: false
